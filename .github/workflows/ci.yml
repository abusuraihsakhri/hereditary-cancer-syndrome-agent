name: Python tests and Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[server,dev]"
      - name: Compile Python modules
        run: python -m compileall -q agents hereditary_cancer_syndrome_agent hereditary_cancer.py cli.py enrichment.py
      - name: Run all Python tests
        run: python -m pytest -q
      - name: Build distribution
        run: python -m pip wheel --no-deps . -w dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node web/test_app.cjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify container build
        run: docker build -t hereditary-cancer-demo .

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy browser rule sandbox
        id: deploy
        uses: actions/deploy-pages@v4
