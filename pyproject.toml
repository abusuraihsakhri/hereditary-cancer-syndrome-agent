[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hereditary-cancer-syndrome-engine"
version = "2.0.0"
description = "HereditaryCancer Sentinel: Germline Variant & NCCN Genetic Testing Criteria Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hereditary-cancer-syndrome-engine = "hereditary_cancer_syndrome_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/hereditary-cancer-syndrome-engine"
Repository = "https://github.com/abusuraihsakhri/hereditary-cancer-syndrome-engine.git"
