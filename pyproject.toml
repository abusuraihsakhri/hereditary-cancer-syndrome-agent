[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hereditary-cancer-syndrome-engine"
version = "2.0.1"
description = "Synthetic rule-engine demonstration; not clinical decision support"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
hereditary-cancer-syndrome-engine = "hereditary_cancer_syndrome_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/hereditary-cancer-syndrome-agent"
Repository = "https://github.com/abusuraihsakhri/hereditary-cancer-syndrome-agent"

[tool.setuptools]
packages = ["agents", "hereditary_cancer_syndrome_agent"]
py-modules = ["cli", "hereditary_cancer", "enrichment", "simulator", "hereditary_cancer_app", "hereditary_cancer_syndrome_agent_app"]
